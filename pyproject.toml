[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "DJ",
    "UP",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
    "DJ001",
]

[tool.ruff.lint.isort]
known-first-party = ["attendance", "config", "day", "event", "person", "user", "utils"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = [
    "^\\.venv/",
    "/migrations/",
    "^staticfiles/",
    "^media/",
]

[[tool.mypy.overrides]]
module = ["decouple"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["attendance", "config", "day", "event", "person", "user", "utils"]
omit = [
    "*/migrations/*",
    "config/wsgi.py",
    "config/asgi.py",
    "config/celery_config.py",
    "event/management/commands/real_time.py",
    "event/management/commands/tg_diag.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
